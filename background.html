<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배경색 연습</title>
    <style>
      #container {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      #box1 {
        background-color: pink;
      }
      #box2 {
        background-color: skyblue;
      }
      #box3 {
        background-color: lightgreen;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="box1">박스1</div>
      <div id="box2">박스2</div>
      <div id="box3">박스3</div>
    </div>
  </body>
</html>
